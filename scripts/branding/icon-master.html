<!doctype html>
<html><head><meta charset="utf-8"><title>icon master</title>
<style>
  /* Rendered by headless Chrome at 1024x1024 with a transparent background.
     #round = rounded tile (favicons, android-chrome, mail logo)
     #full  = full-bleed tile with the mark inside the maskable safe zone (apple, mstile, maskable) */
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .tile { width: 1024px; height: 1024px; background: #0b261b; display: grid; place-items: center; }
  .round .tile { border-radius: 225px; }
  svg { color: #a6e72a; display: block; }
  .round svg { width: 700px; }
  .full svg { width: 600px; }
</style></head>
